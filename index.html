<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#172B4D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kings Building Materials | Lokoja, Kogi State</title>
    <meta
      name="description"
      content="Quality cement, iron rods, roofing, sand, timber and plumbing supplies in Lokoja, Kogi State, Nigeria."
    />
    <meta name="author" content="Kings Building Materials" />
    <link rel="canonical" href="https://kingsbuildmaterials.ng/" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('buildstore_theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0B1220' : '#172B4D');
        } catch (error) {
          /* first paint falls back to light theme */
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kings Building Materials" />
    <meta property="og:title" content="Kings Building Materials | Lokoja, Kogi State" />
    <meta
      property="og:description"
      content="Wholesale and retail supplier of certified cement, TMT iron rods, roofing sheets, timber and plumbing supplies in Lokoja, Kogi State."
    />
